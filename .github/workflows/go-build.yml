# Go Build Workflow
#
# Builds, tests Go projects with SonarQube analysis and Docker image creation.
# Uses generic-go-build.yaml for the actual build process.
#
# Triggers:
#   - Push to main or an lts/** branch
#   - Pull requests
#
# See generic-go-build.yaml for full documentation on build features and required secrets/vars.

name: Build

run-name: >
  Build —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and test
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit

  verify:
    name: Verify Fiber contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go list -m all
          if go list -m all | grep -q 'github.com/gofiber/fiber/v2'; then
            echo 'Fiber v2 remains in the module graph'
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check request and listener lifecycles with the race detector
        run: go test -race -p 1 -count=1 -timeout 5m ./...
